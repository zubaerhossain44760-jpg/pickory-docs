<main class="pf-page-container pf-changelog-container" id="main-content" tabindex="-1"
  data-changelog="theme">
  <header class="doc-header-block doc-overview-header" id="theme-changelog-overview">
    <h1 class="doc-main-title">Pickory Theme — <span class="doc-main-title-sub">Changelog &amp; Releases</span></h1>
    <p class="doc-lead-paragraph">
      Version history, template updates, and style token improvements for Pickory Theme.
    </p>
  </header>

  <!-- Filter chips -->
  <div class="changelog-filters" id="changelog-filters">
    <span class="changelog-filter-label">Filter</span>
    <!-- chips injected by JS -->
  </div>

  <!-- Release timeline (rendered by JS) -->
  <ol class="changelog-timeline" id="changelog-releases" aria-label="Release history"></ol>
  <p class="changelog-empty" id="changelog-empty" hidden>No changes match this filter.</p>
</main>
